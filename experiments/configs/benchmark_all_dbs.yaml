experiment:
  name: "benchmark_all_dbs_msmarco"

dataset:
  type: "msmarco"
  collection_path: "data/msmarco/collection.tsv"
  queries_path: "data/msmarco/queries.dev.small.tsv"
  qrels_path: "data/msmarco/qrels.dev.small.tsv"
  max_documents: 1000
  num_queries: 500

chunker:
  chunk_size: 512
  overlap: 50

embedder:
  model_name: "all-MiniLM-L6-v2"
  device: "mps"
  batch_size: 32
  normalize_embeddings: true

evaluator:
  k_values: [1, 3, 5, 10]

pipeline:
  top_k: 10

chroma_retriever:
  collection_name: "bench_chroma_msmarco"
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

qdrant_retriever:
  collection_name: "bench_qdrant_msmarco"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

faiss_retriever:
  collection_name: "bench_faiss_msmarco"
  distance_metric: "cosine"
  index_type: "hnsw"
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

milvus_retriever:
  collection_name: "bench_milvus_msmarco"
  distance_metric: "cosine"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

elasticsearch_retriever:
  index_name: "bench_elasticsearch_msmarco"
  distance_metric: "cosine"
  in_memory: false
  host: "http://localhost:9200"
  num_candidates: 64
  hnsw_m: 16
  hnsw_ef_construction: 200

weaviate_retriever:
  collection_name: "bench_weaviate_msmarco"
  distance_metric: "cosine"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64
