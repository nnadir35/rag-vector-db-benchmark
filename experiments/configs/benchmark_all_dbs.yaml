experiment:
  name: "benchmark_all_dbs_squad"

dataset:
  split: "validation"
  max_samples: 1000
  version: "squad_v2"

chunker:
  chunk_size: 512
  overlap: 50

embedder:
  model_name: "all-MiniLM-L6-v2"
  device: "mps"
  batch_size: 32
  normalize_embeddings: true

evaluator:
  k_values: [1, 3, 5, 10]

pipeline:
  top_k: 10

chroma_retriever:
  collection_name: "bench_chroma_squad"
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

qdrant_retriever:
  collection_name: "bench_qdrant_squad"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

faiss_retriever:
  collection_name: "bench_faiss_squad"
  distance_metric: "cosine"
  index_type: "hnsw"
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

milvus_retriever:
  collection_name: "bench_milvus_squad"
  distance_metric: "cosine"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

elasticsearch_retriever:
  index_name: "bench_elasticsearch_squad"
  distance_metric: "cosine"
  in_memory: false
  host: "http://localhost:9200"
  num_candidates: 64
  hnsw_m: 16
  hnsw_ef_construction: 200

weaviate_retriever:
  collection_name: "bench_weaviate_squad"
  distance_metric: "cosine"
  in_memory: false
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64
