experiment:
  name: "baseline_elasticsearch_squad"

dataset:
  split: "validation"
  max_samples: 100
  version: "squad_v2"

chunker:
  chunk_size: 512
  overlap: 50

embedder:
  model_name: "all-MiniLM-L6-v2"
  device: "mps"
  batch_size: 32
  normalize_embeddings: true

retriever:
  type: "elasticsearch"
  index_name: "es_squad_bench"
  distance_metric: "cosine"
  in_memory: false
  host: "http://localhost:9200"

generator:
  model_name: "ollama/llama3:8b"
  temperature: 0.0
  max_tokens: 512
  api_base: "http://localhost:11434"
  system_prompt: "Answer based only on the provided context. Be highly concise."

evaluator:
  k_values: [1, 3, 5, 10]

pipeline:
  top_k: 10
  evaluate_retrieval: true
  evaluate_generation: false
